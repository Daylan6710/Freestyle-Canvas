<!DOCTYPE html>
<html>
<head>
    <title>Drawing a Foot</title>
</head>
<body>

<canvas id="myCanvas" width="400" height="450"
        style="border:1px solid black;">
</canvas>

<script>
    var canvas = document.getElementById("myCanvas");
    var context = canvas.getContext("2d");

    // Set drawing colors
    context.strokeStyle = "#A52A2A"; // brown
    context.fillStyle = "#BF5700";   // burnt orange
    context.lineWidth = 5;

    // --- Draw the foot ---
    context.beginPath();

    // Heel
    context.moveTo(150, 350);

    // Bottom of foot
    context.quadraticCurveTo(100, 330, 105, 270);

    // Arch
    context.quadraticCurveTo(115, 230, 145, 210);

    // Top of foot
    context.quadraticCurveTo(160, 160, 200, 130);

    // Big toe
    context.quadraticCurveTo(245, 100, 270, 135);

    // Top of toes
    context.quadraticCurveTo(290, 145, 280, 165);
    context.quadraticCurveTo(310, 165, 305, 185);
    context.quadraticCurveTo(325, 190, 310, 210);
    context.quadraticCurveTo(325, 225, 300, 240);

    // Side of foot
    context.quadraticCurveTo(285, 270, 260, 290);
    context.quadraticCurveTo(240, 320, 220, 345);

    // Connect back to heel
    context.quadraticCurveTo(190, 370, 150, 350);

    context.closePath();

    // Fill and outline the foot
    context.fill();
    context.stroke();

    // --- Draw toe details ---
    context.strokeStyle = "#0029e2";
    context.lineWidth = 3;

    context.beginPath();

    context.moveTo(270, 165);
    context.quadraticCurveTo(260, 180, 265, 195);

    context.moveTo(295, 190);
    context.quadraticCurveTo(280, 205, 285, 220);

    context.moveTo(305, 215);
    context.quadraticCurveTo(290, 230, 290, 240);

    context.stroke();

</script>
